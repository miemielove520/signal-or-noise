name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[ml,research,dev]"
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Run tests with coverage
        run: |
          python -m coverage run --source=src/stock_selector -m unittest discover -s tests
          python -m coverage report --skip-covered --sort=cover
      - name: Reproduce statistical post-mortem
        if: matrix.python-version == '3.13'
        run: python research/forward_test.py
