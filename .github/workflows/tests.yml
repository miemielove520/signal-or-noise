name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[ml,research,dev]"
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Run tests with coverage
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report --skip-covered --sort=cover
      - name: Reproduce the statistical post-mortem exactly
        if: matrix.python-version == '3.13'
        run: |
          python research/forward_test.py
          git diff --exit-code results/summary.json
      - name: Upload regenerated figures
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: postmortem-figures
          path: results/figures
