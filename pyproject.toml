[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-selector"
version = "0.1.0"
description = "Research framework for multi-factor stock selection."
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "yfinance",
]

[project.optional-dependencies]
ml = ["scikit-learn"]
research = ["matplotlib"]
dev = ["coverage", "pytest", "ruff"]

[project.scripts]
stock-selector = "stock_selector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["results/data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
