[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-selector"
version = "1.0.0"
description = "Multi-factor stock model, frozen real-time forward test, and statistical post-mortem (signal-or-noise)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "miemielove520" }]
keywords = ["statistics", "backtesting", "block bootstrap", "forecast calibration", "multiple testing", "reproducible research"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "yfinance",
]

[project.optional-dependencies]
ml = ["scikit-learn"]
research = ["markdown", "matplotlib"]
dev = ["coverage", "ruff"]

[project.urls]
Repository = "https://github.com/miemielove520/signal-or-noise"
Report = "https://github.com/miemielove520/signal-or-noise/blob/main/results/REPORT.md"

[project.scripts]
stock-selector = "stock_selector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["src/stock_selector"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["results/data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
